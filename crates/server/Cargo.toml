[package]
name = "rust-oxide"
version = "0.1.0"
edition = "2024"

[features]
default = ["auth-local", "todo-example", "docs", "realtime"]
auth-local = ["dep:argon2", "dep:jsonwebtoken", "dep:rand"]
todo-example = ["auth-local"]
docs = []
realtime = ["dep:realtime", "axum/ws"]

[dependencies]
axum = { version="0.8.7", features=["json"] }
anyhow = { version = "1.0.100", features = ["std"] }
argon2 = { version = "0.5", features = ["alloc"], optional = true }
askama = "0.15.1"
base_entity_derive = { path = "../base_entity_derive" }
chrono = { version = "0.4", features = ["clock", "serde", "std"] }
futures-util = "0.3"
jsonwebtoken = { version = "10", features = ["aws_lc_rs"], optional = true }
rand = { version = "0.8", optional = true }
reqwest={version = "0.12.26", features=["json"]}
sea-orm = { version = "2.0.0-rc.26", features = ["entity-registry", "macros", "mock", "runtime-tokio-rustls", "schema-sync", "sqlx-postgres", "sqlx-sqlite", "with-chrono", "with-uuid", "with-json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror="2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6.8", features = ["trace", "fs", "catch-panic"] }
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
dotenvy="0.15.7"
async-trait = "0.1.89"
config = "0.15.18"
realtime = { package = "rust-oxide-realtime", path = "../realtime", optional = true }

[build-dependencies]
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full", "visit"] }

[[example]]
name = "realtime_client"
required-features = ["realtime"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 0
strip = "debuginfo"
panic = "unwind"
incremental = false

[profile.release.build-override]
opt-level = 0
codegen-units = 256
